server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashes no nome do arquivo permitem cache agressivo com seguranca.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: /contratacoes nao existe como arquivo no disco. Sem esse fallback,
    # recarregar a pagina em uma rota interna devolveria 404 do nginx em vez de
    # deixar o React Router resolver.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
